name: CI

concurrency:
  group: fluxqueue-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "work/**"]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci-test.db
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Compile application, migrations, tests, and benchmark utility
        run: python -m compileall -q src migrations tests scripts
      - name: Validate fresh schema migration
        run: alembic upgrade head
      - name: Validate upgrade from the pre-worker schema
        run: alembic downgrade base && alembic upgrade head
      - run: ruff check .
      - run: ruff format --check .
      - name: Verify tenant migration preserves existing jobs and can downgrade
        run: pytest -q tests/test_migrations.py
      - name: Run unit and API tests
        run: pytest --cov=fluxqueue --cov-report=xml --junitxml=junit.xml
      - name: Archive test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluxqueue-test-reports
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build container image
        run: docker build --tag fluxqueue-ci .
      - name: Verify container runs as non-root
        run: test "$(docker image inspect --format '{{.Config.User}}' fluxqueue-ci)" = "10001:10001"
      - name: Smoke-test container startup, migrations, and protected routes
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name fluxqueue-smoke \
            --publish 127.0.0.1:8000:8000 \
            --env DATABASE_URL=sqlite:////tmp/fluxqueue-smoke.db \
            --env APP_ENV=production \
            --env API_KEY=ci-smoke-test-key \
            fluxqueue-ci
          cleanup() { docker rm --force fluxqueue-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/health/live)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/api/v1/jobs)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Authorization: Bearer ci-smoke-test-key' \
            http://127.0.0.1:8000/api/v1/jobs)" = "200"
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fluxqueue
          POSTGRES_USER: fluxqueue
          POSTGRES_PASSWORD: fluxqueue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxqueue -d fluxqueue"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fluxqueue:fluxqueue@localhost:5432/fluxqueue
      FLUXQUEUE_POSTGRES_TEST_URL: postgresql+psycopg://fluxqueue:fluxqueue@localhost:5432/fluxqueue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Validate PostgreSQL migration
        run: alembic upgrade head
      - name: Exercise PostgreSQL locking and lease fencing
        run: pytest -q tests/test_postgres_integration.py --junitxml=postgres-junit.xml
      - name: Archive PostgreSQL integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluxqueue-postgres-integration-report
          path: postgres-junit.xml
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and dependency auditor
        run: python -m pip install -e '.[dev]' pip-audit
      - name: Audit resolved Python dependencies
        run: pip-audit

  security:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      # Keep CI usable when GitHub code scanning is not enabled for this repository.
      # SARIF is retained as an artifact; enabling code scanning allows upload to Security alerts.
      - uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: results
      - name: Archive CodeQL SARIF results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluxqueue-codeql-sarif
          path: results/*.sarif
          if-no-files-found: warn
          retention-days: 14
