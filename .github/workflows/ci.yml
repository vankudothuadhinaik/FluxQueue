name: CI

concurrency:
  group: fluxqueue-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci-test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Validate fresh schema migration
        run: alembic upgrade head
      - name: Validate upgrade from the pre-worker schema
        run: alembic downgrade base && alembic upgrade head
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=fluxqueue --cov-report=xml
      - name: Build container image
        run: docker build --tag fluxqueue-ci .
      - name: Verify container runs as non-root
        run: test "$(docker image inspect --format '{{.Config.User}}' fluxqueue-ci)" = "10001:10001"
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage.xml
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fluxqueue
          POSTGRES_USER: fluxqueue
          POSTGRES_PASSWORD: fluxqueue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxqueue -d fluxqueue"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fluxqueue:fluxqueue@localhost:5432/fluxqueue
      FLUXQUEUE_POSTGRES_TEST_URL: postgresql+psycopg://fluxqueue:fluxqueue@localhost:5432/fluxqueue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Validate PostgreSQL migration
        run: alembic upgrade head
      - name: Exercise PostgreSQL locking and lease fencing
        run: pytest -q tests/test_postgres_integration.py

  security:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
