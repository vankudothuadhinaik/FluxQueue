services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fluxqueue
      POSTGRES_USER: fluxqueue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluxqueue-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxqueue -d fluxqueue"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://fluxqueue:${POSTGRES_PASSWORD:-fluxqueue-local-only}@db:5432/fluxqueue
      APP_ENV: development
      API_KEY: ${API_KEY:-}
      API_KEYS: ${API_KEYS:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  worker:
    build: .
    command: ["python", "-m", "fluxqueue.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://fluxqueue:${POSTGRES_PASSWORD:-fluxqueue-local-only}@db:5432/fluxqueue
      APP_ENV: development
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
